# CI gate for code quality: formatting, clippy, and lint-check.
#
# Enforces:
#   - Rust formatting (cargo fmt --check)
#   - Clippy at deny level for cognitive complexity and excessive function length;
#     all other lints remain at warn level per Cargo.toml [lints.clippy].
#   - Workspace lint-check binary (file/function size limits).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt · clippy · lint-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "runie-lint"
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy (deny cognitive_complexity + too_many_lines)
        # Cognitive complexity and excessive function length are the two lints
        # also enforced by lint-check.  Upgrade them from warn → deny so CI
        # fails instead of just printing warnings.
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            -- \
            -D clippy::cognitive_complexity \
            -D clippy::too_many_lines

      - name: Run lint-check (file + function size limits)
        run: cargo run -p lint-check
