[meta]
name = "Runie"
author = "runie"
variant = "dark"
version = "1.0"
description = "Warm charcoal surfaces with restrained orange accents"

[palette]
orange_500 = "#EE6902"
orange_400 = "#F5853F"
orange_600 = "#D45A00"
orange_300 = "#F9A85F"
amber_400 = "#D99A3D"
amber_300 = "#E7B866"
coral_400 = "#C96B78"
green_400 = "#8FAF72"
red_400 = "#C96B78"
blue_400 = "#8BA4B8"
lime_400 = "#A9AF70"

bg_code = "#1E1920"
bg_base = "#171417"
bg_panel = "#201B20"
bg_highlight = "#2B2521"
bg_elevated = "#201820"
bg_active = "#302830"
bg_selection = "#3A3028"
bg_user = "#242424"
# Grok-style multi-tier block backgrounds (grok-build parity).
bg_light = "#2E2E2E"
bg_dark = "#101010"

text_primary = "#EDE8E3"
text_secondary = "#C4BEB7"
text_muted = "#8A8580"
text_dim = "#5C5854"

# Feed palette — grok CLI parity (verified SGR captures, dark mode).
feed_dim = "#6C6C6C"
feed_chevron = "#585858"
feed_user_fg = "#E1E1E1"
feed_agent_fg = "#C8C8C8"

[tokens]
"text.primary" = "text_primary"
"text.secondary" = "text_secondary"
"text.muted" = "text_muted"
"text.dim" = "text_dim"

"bg.code" = "bg_code"
"bg.base" = "bg_base"
"bg.panel" = "bg_panel"
"bg.highlight" = "bg_highlight"
"bg.elevated" = "bg_elevated"
"bg.active" = "bg_active"
"bg.selection" = "bg_selection"
"bg.user" = "bg_user"
"bg.light" = "bg_light"
"bg.dark" = "bg_dark"

# Shadcn-inspired semantic surface aliases.
"surface.base" = "bg_base"
"surface.muted" = "bg_panel"
"surface.elevated" = "bg_elevated"
"surface.interactive" = "bg_active"

# Feed tokens — grok CLI parity. Themes that lack these fall back to
# their own dim/muted equivalents (see theme::styles).
"feed.dim" = "feed_dim"
"feed.chevron" = "feed_chevron"
"feed.user.fg" = "feed_user_fg"
"feed.agent.fg" = "feed_agent_fg"

"accent.primary" = "orange_500"
"accent.secondary" = "amber_400"
"accent.tertiary" = "coral_400"
"accent.deep" = "orange_600"
# Grok-style semantic accents (grok-build parity).
"accent.thinking" = "amber_400"
"accent.plan" = "orange_300"
"accent.feedback" = "orange_400"
"accent.monitor" = "orange_400"

# Feed lifecycle rails: restrained semantic accents. Rails are secondary
# structure, so they are less prominent than the corresponding status text.
rail_running = "orange_400"
rail_success = "#788F61"
rail_error = "#B65F6D"
rail_thinking = "text_dim"

"rail.running" = "rail_running"
"rail.success" = "rail_success"
"rail.error" = "rail_error"
"rail.thinking" = "rail_thinking"

success = "green_400"
error = "red_400"
warning = "amber_400"
info = "blue_400"

"border.focused" = "orange_500"
"border.unfocused" = "text_dim"

"code.keyword" = "amber_400"
"code.function" = "orange_500"
"code.string" = "lime_400"
"code.number" = "amber_300"
"code.comment" = "text_dim"
"code.type" = "blue_400"
"code.line_number" = "text_dim"

[styles]
keyword = { fg = "accent.primary", bold = true }
line_number = { fg = "code.line_number" }
cursor_line = { bg = "bg.highlight" }
selected = { fg = "accent.secondary", bg = "bg.highlight" }
active_selected = { fg = "accent.primary", bg = "bg.active", bold = true }
focused_border = { fg = "border.focused" }
unfocused_border = { fg = "border.unfocused" }
success_style = { fg = "success" }
error_style = { fg = "error" }
warning_style = { fg = "warning" }
info_style = { fg = "info" }
dimmed = { fg = "text.dim" }
muted = { fg = "text.muted" }
inline_code = { fg = "success", bg = "bg.code" }
