name: visual-subagent-card
description: >-
  Grok subagent lifecycle cards use explicit started/completed semantic text.
initial_prompt: "Delegate this"
tools:
  - name: subagent
    kind: subagent
events:
  - start
  - tool_call:
      name: subagent
      args: { description: "inspect the repository" }
  - tool_mode:
      tool_call_id: call-1
      mode: expanded
  - done: { stop_reason: stop }
assertions:
  state:
    status: ready
    is_streaming: false
    messages: 4
    tool_blocks: 1
  visual:
    cols: 80
    rows: 24
    screen_text:
      - "Subagent completed: \"inspect the repository\""
    screen_excludes:
      - "subagent {"
