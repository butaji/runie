name: visual-command-palette-movement
description: Palette selection movement is bounded and visible in the YAML oracle.
events: []
assertions:
  visual:
    cols: 80
    rows: 24
    steps:
      - Ctrl+P
      - PaletteDown
    ui:
      command_palette_open: true
      command_palette_query: ""
      command_palette_index: 1
    screen_text:
      - "Commands"
      - "Keyboard Shortcuts"
