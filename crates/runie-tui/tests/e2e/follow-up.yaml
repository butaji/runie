name: follow-up
description: A queued follow-up message is appended to the transcript.
initial_prompt: "first"
follow_up:
  - "second"
  - "third"
follow_up_mode: all
events:
  - start
  - text_delta: "first-reply"
  - done: { stop_reason: stop }
assertions:
  transcript_contains:
    - "first"
    - "first-reply"
    - "second"
    - "third"
  events:
    - agent_start
    - agent_end
  turn_starts: 2
