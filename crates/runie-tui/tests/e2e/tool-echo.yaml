name: tool-echo
description: Echo tool invoked; toolResult line appears in transcript.
initial_prompt: "echo hi"
tools:
  - name: echo
    kind: echo
events:
  - start
  - text_delta: "ok"
  - done: { stop_reason: stop }
assertions:
  exact_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_end
    - turn_end
    - agent_end
  state:
    is_streaming: false
    pending_tool_calls: 0
    messages: 2
  transcript_contains:
    - "echo hi"
    - "ok"
  scrollback_lines:
    - kind: user
      contains: "echo hi"
    - kind: assistant
      contains: "ok"
