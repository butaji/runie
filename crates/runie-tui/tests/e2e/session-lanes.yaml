name: session-lanes
description: >-
  Replays Pi session-tree lane mutations through the SessionActor and asserts
  the pure lane projection at runtime.
initial_prompt: "seed the session"
events:
  - session_lane:
      lane: feature
      leaf_id: entry-1
  - session_lane:
      lane: feature
      leaf_id: null
      create: false
  - reset
assertions:
  state:
    session_lanes:
      main: null
