name: hello-streaming
description: Single-turn text-only streaming response.
initial_prompt: "say hi"
tools: []
events:
  - start
  - text_delta: "Hello"
  - text_delta: " world"
  - done: { stop_reason: stop }
assertions:
  exact_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_update
    - message_end
    - turn_end
    - agent_end
  pi_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_update
    - message_end
    - turn_end
    - agent_end
  listener_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_update
    - message_end
    - turn_end
    - agent_end
  state:
    status: ready
    is_streaming: false
    pending_tool_calls: 0
    messages: 2
    session_entries: 2
    compaction_token_estimates: [40, 40]
    compaction_keep_recent_tokens: 20
    compaction_first_kept_entry_index: 1
    compaction_split_turn: true
    compaction_history_indices: []
    compaction_turn_prefix_indices: [0]
    compaction_retained_indices: [1]
    compaction_tokens_before: 80
  transcript_contains:
    - "Hello world"
    - "say hi"
  events:
    - agent_start
    - turn_start
    - message_start
    - message_update
    - message_end
    - turn_end
    - agent_end
  scrollback_lines:
    - kind: user
      contains: "say hi"
    - kind: assistant
      contains: "Hello world"
