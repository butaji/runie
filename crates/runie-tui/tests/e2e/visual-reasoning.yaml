name: visual-reasoning
description: Full-mode reasoning transcript and status rendering.
initial_prompt: "explain"
events:
  - start
  - thinking_delta: "checking the request"
  - text_delta: "The answer is ready."
  - done: { stop_reason: stop }
assertions:
  state:
    is_streaming: false
    pending_tool_calls: 0
    reasoning_expanded: false
  visual:
    cols: 80
    rows: 30
    screen_text:
      - "❯ explain"
      - "❙  ◆ Thought"
      - "◆ Thought for 0.9s"
      - "ready."
      - "Enter:send"
    screen_excludes:
      - "panicked"
