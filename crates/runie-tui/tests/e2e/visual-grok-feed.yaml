name: visual-grok-feed
description: |
  Strict full-mode feed state derived from artifacts/grok-rich.cast.
  This fixture is rendered through Ratatui TestBackend and compared by
  symbol at every cell in the transcript rows.

initial_prompt: "Please reply with a short markdown-formatted paragraph about this directory, using a heading, bold text, and a bullet list. Then list the files in this directory."
capture_while_waiting: true
tools:
  - name: list_dir
    kind: list_dir
  - name: read
    kind: read
events:
  - start
  - tool_call:
      name: list_dir
      args: { path: "." }
  - tool_call:
      name: read
      args: { path: "README.md" }
  - done: { stop_reason: tool_use }
  - waiting: model
  - theme: terminal_native

assertions:
  visual:
    cols: 80
    rows: 24
    activity_expanded: false
    header_meter: "20K / 500K"
    waiting_chrome: " 0.0s                            6.0s ⇣20.7k [stop]"
    reference:
      cast: grok-rich.cast
      frame_contains: ["Listed 1 dir", "Read 1 file"]
      exact_screen: true
      # The legacy reference still contains 73 mixed-theme style cells after
      # event-boundary propagation; keep symbol parity strict until recapture.
      exact_attributes: false
      rows:
        - contains: "Listed 1 dir"
          exact: true
    screen_text:
      - "◈ Listed 1 dir, Read 1 file"
    screen_excludes:
      - "(run finished"
