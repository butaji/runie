name: visual-operation-lifecycle
description: >-
  Operation-lane records reduce through the SessionActor lifecycle projection.
events:
  - operation_record:
      record_type: operation_started
      data:
        id: op-yaml
        lane: main
        intent:
          kind: run
  - operation_record:
      record_type: abort_requested
      data:
        id: op-yaml
        lane: main
  - operation_record:
      record_type: operation_finished
      data:
        id: op-yaml
        lane: main
        outcome: aborted
  - operation_record:
      record_type: operation_started
      data:
        id: op-failed
        lane: main
        intent:
          kind: compaction
  - operation_record:
      record_type: operation_finished
      data:
        id: op-failed
        lane: main
        outcome: failed
        error:
          code: provider_error
          message: upstream unavailable
assertions:
  state:
    session_config_records: []
    active_operations: {}
    operation_outcomes:
      run-1: completed
      op-yaml: aborted
      op-failed: failed
    operation_kinds:
      run-1: run
      op-yaml: run
      op-failed: compaction
    operation_errors:
      op-failed:
        code: provider_error
        message: upstream unavailable
