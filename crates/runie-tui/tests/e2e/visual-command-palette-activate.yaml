name: visual-command-palette-activate
description: Palette activation publishes Reset for the supported New Session action.
events: []
assertions:
  visual:
    cols: 80
    rows: 24
    steps:
      - Ctrl+P
      - "new"
      - PaletteEnter
    ui:
      show_welcome: false
      shortcuts_open: false
      command_palette_open: false
      command_palette_query: ""
      command_palette_index: 0
    screen_excludes:
      - "Command Palette"
      - "Commands"
