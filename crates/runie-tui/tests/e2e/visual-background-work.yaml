name: visual-background-work
description: Background-work lifecycle is carried as typed events and projected into the actor-owned feed.
initial_prompt: "Inspect this repository in the background"
events:
  - start
  - background_start:
      work_id: worker-1
      description: "inspect the repository"
      background: true
  - background_progress:
      work_id: worker-1
      description: "inspect the repository"
      activity: "Reading files"
  - background_end:
      work_id: worker-1
      description: "inspect the repository"
      elapsed_ms: 900
  - background_start:
      work_id: worker-2
      description: "run the checks"
      background: true
  - background_end:
      work_id: worker-2
      description: "run the checks"
      is_error: true
      elapsed_ms: 1200
  - background_start:
      work_id: worker-3
      description: "stop the watcher"
      background: true
  - background_cancel:
      work_id: worker-3
      description: "stop the watcher"
      elapsed_ms: 1500
  - done: { stop_reason: stop }
assertions:
  events:
    - background_work_started
    - background_work_progress
    - background_work_finished
  visual:
    cols: 80
    rows: 24
    screen_text:
        - "Subagent completed in 0.9s: \"inspect the repository\""
        - "Subagent failed in 1.2s: \"run the checks\""
        - "Subagent cancelled in 1.5s: \"stop the watcher\""
  scrollback_lines:
    - kind: tool_error
      contains: "Subagent failed"
    - kind: tool_error
      contains: "Subagent cancelled"
