name: visual-status-working
description: |
  Replays the Grok working-state status row from an asciinema dump. The
  terminal frame and Runie status are selected entirely from YAML.
events:
  - start
  - thinking_level: high
  - context_window: 1000
  - active_tools: [read, bash]
  - branch_summary:
      from_id: entry-1
      summary: "Earlier branch"
      details:
        source: replay
  - custom_entry:
      custom_type: replay.marker
      data:
        value: 42
  - compaction:
      summary: "Compacted earlier context"
      tokens_before: 2048
  - operation_record:
      record_type: operation_started
      data:
        id: op-1
        lane: main
        intent:
          kind: run
  - text_delta: "working"
assertions:
  state:
    thinking_level: high
    is_streaming: false
    pending_tool_calls: 0
    messages: 1
    session_branch_entry_ids:
      - entry-1
      - entry-2
      - entry-3
      - entry-4
      - entry-5
      - entry-6
    session_branch_context_roles: [compactionSummary]
    session_config_records:
      - thinking_level_change
      - active_tools_change
      - branch_summary
      - custom
      - compaction
    compaction_context_entry_ids: []
    compaction_context_roles: [compactionSummary]
    compaction_context_tokens: 901
    compaction_reserve_tokens: 100
    compaction_enabled: true
    compaction_should_run: true
    active_operations:
      op-1: started
  visual:
    cols: 80
    rows: 24
    reference:
      cast: grok-rich.cast
      frame_after: ["Starting session…"]
      frame_contains: ["Thinking…"]
      rows:
        - contains: "Thinking…"
          exact: false
    screen_text:
      - "Thinking…"
