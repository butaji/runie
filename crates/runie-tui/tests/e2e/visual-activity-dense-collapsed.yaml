name: visual-activity-dense-collapsed
description: Collapsed Grok dense groups keep the visible tail in the viewport.
initial_prompt: "inspect the repository"
tools:
  - name: bash
    kind: bash
events:
  - start
  - tool_call: { name: bash, args: { cmd: "one" } }
  - tool_call: { name: bash, args: { cmd: "two" } }
  - tool_call: { name: bash, args: { cmd: "three" } }
  - tool_call: { name: bash, args: { cmd: "four" } }
  - tool_call: { name: bash, args: { cmd: "five" } }
  - tool_call: { name: bash, args: { cmd: "six" } }
  - tool_call: { name: bash, args: { cmd: "seven" } }
  - tool_call: { name: bash, args: { cmd: "eight" } }
  - tool_call: { name: bash, args: { cmd: "nine" } }
  - tool_call: { name: bash, args: { cmd: "ten" } }
  - tool_call: { name: bash, args: { cmd: "eleven" } }
  - tool_call: { name: bash, args: { cmd: "twelve" } }
  - done: { stop_reason: stop }
assertions:
  state:
    tool_blocks: 12
  visual:
    cols: 80
    rows: 30
    activity_expanded: false
    steps: [Down, Down]
    selected_tool_id: call-2
    screen_text:
      - "Run two"
    screen_excludes:
      - "Run one"
    layout_matrix:
      - cols: 62
        rows: 32
        screen_text: ["Run two"]
        screen_excludes: ["Run one"]
      - cols: 80
        rows: 24
        screen_text: ["Run two"]
        screen_excludes: ["Run one"]
      - cols: 100
        rows: 30
        screen_text: ["Run two"]
        screen_excludes: ["Run one"]
      - cols: 120
        rows: 36
        screen_text: ["Run two"]
        screen_excludes: ["Run one"]
