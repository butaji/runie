name: visual-hey
description: >-
  Baseline working-view conversation: submit the literal prompt "Hey" and
  render one short assistant response with Grok's transcript rail geometry.
initial_prompt: "Hey"
prompt_timestamp: "9:27 PM"
events:
  - start
  - text_delta: "Hi there!"
  - done:
      stop_reason: stop
      usage:
        input: 7
        output: 8
        total_tokens: 15
assertions:
  exact_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_end
    - turn_end
    - agent_end
  state:
    is_streaming: false
    pending_tool_calls: 0
    messages: 2
  visual:
    cols: 80
    rows: 30
    screen_text:
      - "❯ Hey"
      - "┃  Hi there!"
      - "9:27 PM"
      - "Worked for"
      - "Enter:send"
    screen_excludes:
      - "assistant>"
      - "user>"
      - "Thinking…"
      - "Thought"
