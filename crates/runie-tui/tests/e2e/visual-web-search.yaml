name: visual-web-search
description: Grok Web Search cards summarize distinct citation sites and retain neutral source rows.
initial_prompt: "Find Rust terminal UI documentation"
tools:
  - name: web_search
    kind: web_search
events:
  - start
  - tool_call:
      name: web_search
      args: { query: "Rust terminal UI" }
  - tool_mode:
      tool_call_id: call-1
      mode: expanded
  - done: { stop_reason: stop }
assertions:
  state:
    tool_blocks: 1
    tool_kinds: [web_search]
    tool_headers: ["Web Search Rust terminal UI (2 sites)"]
    tool_outputs:
      - ["https://docs.rs/runie", "https://docs.rs/ratatui", "https://rust-lang.org/learn", "https://docs.rs/runie", "https://docs.rs/ratatui", "https://rust-lang.org/learn", "  Sources: docs.rs, rust-lang.org"]
  visual:
    cols: 80
    rows: 24
    screen_text:
      - "Web Search Rust terminal UI (2 sites)"
      - "https://docs.rs/runie"
    scrollback_lines:
      - kind: tool_result
        contains: "https://docs.rs/runie"
      - kind: tool_result
        contains: "Sources: docs.rs, rust-lang.org"
