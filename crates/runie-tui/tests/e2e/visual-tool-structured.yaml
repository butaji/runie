name: visual-tool-structured
description: Structured tool updates render as separate indented output rows.
initial_prompt: "read structured output"
tools:
  - name: structured_tool
    kind: structured_update
events:
  - start
  - tool_call:
      name: structured_tool
      args: { value: "rows" }
  - tool_mode:
      tool_call_id: call-1
      mode: expanded
  - done: { stop_reason: tool_use }
assertions:
  state:
    is_streaming: false
    pending_tool_calls: 0
    messages: 4
    tool_blocks: 1
    tool_output_lines: 2
    tool_row_kinds: [header, content, content]
  transcript_contains:
    - first
    - second
  visual:
    cols: 80
    rows: 30
    screen_text:
      - "◆ structured_tool"
      - "first"
      - "second"
      - "✓"
    screen_excludes:
      - "panicked"
