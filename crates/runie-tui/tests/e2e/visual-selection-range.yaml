name: visual-selection-range
description: Actor-owned transcript selection range is replayable as an event.
initial_prompt: "select"
events:
  - start
  - text_delta: "selection target"
  - done: { stop_reason: stop }
  - select_range: { anchor: 1, head: 3 }
  - mouse_selection_start: { row: 8, column: 4 }
  - mouse_selection_extend: { row: 10, column: 18 }
  - mouse_selection_commit
  - copy_selection
assertions:
  state:
    selection_anchor: 1
    selection_head: 3
    cell_selection:
      anchor: { row: 8, column: 4 }
      head: { row: 10, column: 18 }
    copy_selection_requested: true
    copy_selection_text: ""
  visual:
    cols: 80
    rows: 24
    screen_text:
      - "❯ select"
      - "selection target"
