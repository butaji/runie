name: visual-activity-truncated
description: |
  A Grok truncated tool block keeps its semantic header and only the first
  output row while hiding the remainder.
initial_prompt: "read the file"
tools:
  - name: read
    kind: read
events:
  - start
  - tool_call:
      name: read
      args: { path: "README.md" }
  - done: { stop_reason: tool_use }
  - tool_mode:
      tool_call_id: call-1
      mode: truncated
  - tool_fold: call-1
assertions:
  state:
    tool_blocks: 1
    tool_modes: [expanded]
    tool_kinds: [read]
    tool_headers: ["Read README.md"]
    tool_outputs: [["# runie", "Read README.md (3 lines)", "# runie", "This is **Runie**."]]
  visual:
    cols: 80
    rows: 24
    activity_expanded: false
    screen_text:
      - "Read README.md"
      - "# runie"
