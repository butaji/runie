name: visual-specialized-tools
description: |
  Specialized Grok tool cards keep their semantic headers and completion
  vocabulary instead of falling back to the generic tool label.
initial_prompt: "Search memory, then run the release workflow."
tools:
  - name: memory_search
    kind: memory_search
  - name: workflow
    kind: workflow
events:
  - start
  - tool_call:
      name: memory_search
      args: { query: "actors" }
  - tool_call:
      name: workflow
      args: { name: "release" }
  - tool_mode:
      tool_call_id: call-1
      mode: expanded
  - tool_mode:
      tool_call_id: call-2
      mode: expanded
  - done: { stop_reason: stop }
assertions:
  state:
    tool_kinds: [memory_search, workflow]
  visual:
    cols: 80
    rows: 24
    screen_text:
      - "Memory Search actors (2 results)"
      - "Workflow completed: release"
