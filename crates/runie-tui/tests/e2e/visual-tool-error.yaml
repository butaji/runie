name: visual-tool-error
description: Deterministic tool execution failure renders a Grok-style error card.
initial_prompt: "run the failing tool"
tools:
  - name: read
    kind: error
events:
  - start
  - tool_call:
      name: read
      args: { path: "missing.txt" }
  - done: { stop_reason: tool_use }
assertions:
  pi_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_update
    - message_end
    - tool_execution_start
    - tool_execution_end
    - message_start
    - message_end
    - turn_end
    - turn_start
    - message_start
    - message_end
    - turn_end
    - agent_end
  state:
    is_streaming: false
    pending_tool_calls: 0
    messages: 4
    tool_result_is_error: true
    tool_blocks: 1
    tool_output_lines: 0
    tool_row_kinds: [header, status]
    tool_row_paint_intents: [header, error]
  transcript_contains:
    - "tool failed"
  visual:
    cols: 80
    rows: 30
    screen_text:
      - "◈ Read 1 file · 1 failed"
      - "◆ Read missing.txt"
      - "Enter:send"
    screen_excludes:
      - "panicked"
      - "missing.txt ✗"
