name: visual-command-palette
description: Grok command palette opens, filters entries, and preserves actor-owned query state.
events: []
assertions:
  visual:
    cols: 80
    rows: 24
    steps:
      - Ctrl+P
      - "new"
      - Esc
    palette_open: true
    palette_query: ""
    palette_index: 0
    screen_text:
      - "Commands"
      - "New Session"
