name: visual-operation-admission
description: >-
  Pi session lane admission is an event sequence: malformed and duplicate
  operation records do not change the SessionActor projection.
events:
  - operation_record:
      record_type: operation_started
      data:
        id: op-admission
        lane: main
        seq: 1
        timestamp: 1
        intent:
          kind: run
  - operation_record:
      record_type: operation_started
      data:
        id: op-admission
        lane: main
        seq: 2
        timestamp: 2
        intent:
          kind: run
  - operation_record:
      record_type: operation_started
      data:
        id: op-unknown-kind
        lane: main
        seq: 2
        timestamp: 2
        intent:
          kind: workflow
  - session_flush: true
  - operation_record:
      record_type: operation_finished
      data:
        outcome: completed
  - operation_record:
      record_type: operation_finished
      data:
        id: op-admission
        lane: main
        seq: 3
        timestamp: 3
        outcome: completed
assertions:
  state:
    session_error_contains: "Session event rejected:"
    session_config_records: []
    session_lane_records:
      - operation_started
      - step_attempt
      - usage
      - operation_finished
      - operation_started
      - operation_finished
    active_operations: {}
    operation_outcomes:
      run-1: completed
      op-admission: completed
