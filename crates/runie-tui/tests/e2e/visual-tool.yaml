name: visual-tool
description: Full-mode tool execution rendering.
initial_prompt: "inspect"
tools:
  - name: echo
events:
  - start
  - tool_call:
      name: echo
      args: { value: "hello" }
  - tool_mode:
      tool_call_id: call-1
      mode: expanded
  - done: { stop_reason: tool_use }
assertions:
  state:
    session_tool_started:
      - runId: run-1
        assistantEntryId: entry-2
        toolIndex: 0
        toolCallId: call-1
        toolName: echo
        effectiveArgs: { value: hello }
        resultEntryId: entry-3
        replay: never
  visual:
    cols: 80
    rows: 30
    screen_text:
      - "❯ inspect"
      - "◆ echo"
      - "✓"
      - "Enter:send"
    screen_excludes:
      - "panicked"
