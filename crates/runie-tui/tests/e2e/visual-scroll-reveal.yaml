name: visual-scroll-reveal
description: An explicit Grok-style follow transition reveals new tail content after manual scroll.
initial_prompt: "reveal"
events:
  - start
  - text_delta: "line one\nline two\nline three\nline four\nline five\nline six\nline seven\nline eight\nline nine\nline ten\nline eleven\nline twelve\nline thirteen"
  - done: { stop_reason: stop }
  - scroll: -1
  - reveal_latest: true
assertions:
  state:
    autoscroll: true
    scroll_offset: 9
  visual:
    cols: 40
    rows: 12
    screen_text:
      - "line three"
      - "Enter:send"
    screen_excludes:
      - "panicked"
