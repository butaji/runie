name: deferred-response
description: Pi deferred stop reasons remain intact through YAML replay.
initial_prompt: "defer this"
tools: []
events:
  - start
  - done:
      stop_reason: deferred
      deferred:
        provider: replay
        modelId: model-1
        api: replay-api
        id: deferred-1
        pollAfterMs: 250
        data: { batch: deferred-1 }
assertions:
  exact_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_end
    - turn_end
    - agent_end
  pi_events:
    - agent_start
    - turn_start
    - message_start
    - message_end
    - message_start
    - message_end
    - turn_end
    - agent_end
  state:
    status: ready
    is_streaming: false
    pending_tool_calls: 0
    messages: 2
    assistant_stop_reason: deferred
    assistant_deferred:
      provider: replay
      modelId: model-1
      api: replay-api
      id: deferred-1
      pollAfterMs: 250
      data: { batch: deferred-1 }
  transcript_contains:
    - "defer this"
