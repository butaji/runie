[workspace]
resolver = "2"
members = ["crates/runie-core", "crates/runie-tui-model", "crates/runie-tui", "lint-check"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "rt", "macros", "time", "fs", "net"] }
async-trait = "0.1"
async-stream = "0.3"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
httpdate = "1"
rand = "0.8"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Faster dev builds: opt-level 1, parallel codegen, incremental.
[profile.dev]
opt-level = 1
debug = false
split-debuginfo = "unpacked"
codegen-units = 16
incremental = true

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
